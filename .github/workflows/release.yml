name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build signed release and create draft
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pixelcardemulator-release.jks"
          chmod 600 "$RUNNER_TEMP/pixelcardemulator-release.jks"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/pixelcardemulator-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease
          test -f app/build/outputs/apk/release/app-release.apk

      - name: Create or update draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          apk="app/build/outputs/apk/release/app-release.apk"

          if gh release view "$tag" --json isDraft -q '.isDraft' 2>/dev/null | grep -qx true; then
            gh release upload "$tag" "$apk" --clobber
          elif gh release view "$tag" >/dev/null 2>&1; then
            echo "A published release already exists for $tag; refusing to replace it." >&2
            exit 1
          else
            gh release create "$tag" "$apk" \
              --draft \
              --verify-tag \
              --title "PixelCardEmulator $tag" \
              --generate-notes
          fi
